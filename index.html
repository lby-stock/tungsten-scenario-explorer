 }
 if(r.plane&&$('showSVM').checked){const p=r.plane,y=x=>-(p.coef[0]*x+p.coef[2]*mining+p.intercept)/p.coef[1];out+=`<path d="M${px(0)},${py(y(0))} L${px(20)},${py(y(20))}" clip-path="url(#sliceClip)" fill="none" stroke="#527789" stroke-width="1.8" stroke-dasharray="5 3"/>`;}
 out+=`<rect x="${L}" y="${T}" width="${S}" height="${S}" fill="none" stroke="#bdcfca"/>`;
 for(const v of [0,5,10,15,20])out+=`<text x="${px(v)}" y="${T+S+18}" text-anchor="middle" font-size="11" fill="#6b7c80">${v}</text><text x="${L-9}" y="${py(v)+4}" text-anchor="end" font-size="11" fill="#6b7c80">${v}</text>`;
 out+=`<text x="${L+S/2}" y="${T+S+40}" text-anchor="middle" font-size="11" fill="#287da0">${lang==='zh'?'交通运输':'Transport'} (%)</text><text transform="translate(13 ${T+S/2}) rotate(-90)" text-anchor="middle" font-size="11" fill="#bd7866">${lang==='zh'?'耐用消费品':'Consumer'} (%)</text>`;
 const cx=px(r.state.controls[0]),cy=py(r.state.controls[1]);out+=`<circle cx="${cx}" cy="${cy}" r="7" fill="white" stroke="#183f51" stroke-width="1.7"/><circle cx="${cx}" cy="${cy}" r="3" fill="#183f51"/>`;
 $('slice').innerHTML=out;$('sliceCoordinate').textContent=`${t('sliceMining')} = ${mining}%`;
 $('slice').onclick=e=>{const box=$('slice').getBoundingClientRect(),x=(e.clientX-box.left)/box.width*300,y=(e.clientY-box.top)/box.height*310;if(x<L||x>L+S||y<T||y>T+S)return;$('control0').value=Math.min(20,Math.floor((x-L)/step));$('control1').value=20-Math.min(20,Math.floor((y-T)/step));render();};
}

function download(name,type,body){const blob=new Blob([body],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
$('exportCSV').onclick=()=>{const r=lastResult,s=r.state,keys=['year','transport','consumer','mining','supply','demand','gap','balance','available','stockLoss'];const meta=['pathway','horizon','penetration','bridge','intensity','transport_pct','consumer_pct','mining_pct','opening_inventory_ktW'];const header=meta.concat(['year','transport_increment_ktW','consumer_increment_ktW','mining_increment_ktW','supply_ktW','demand_ktW','annual_balance_ktW','cumulative_balance_ktW','balance_with_inventory_ktW','stock_loss_ktW']);const prefix=[s.pathway,s.horizon,s.p,s.k,s.intensity,...s.controls,s.inventory];download(`tungsten_${s.pathway}_${s.horizon}.csv`,'text/csv;charset=utf-8','\uFEFF'+header.join(',')+'\n'+r.rows.map(v=>prefix.concat(keys.map(k=>Number(v[k]).toPrecision(12))).join(',')).join('\n'));};
$('exportJSON').onclick=()=>{const r=lastResult;download(`tungsten_${r.state.pathway}_${r.state.horizon}.json`,'application/json',JSON.stringify({version:DATA.meta.version,workbook_sha256:DATA.meta.workbook_sha256,state:r.state,checks:r.checks,summary:{supply:r.totalSupply,demand:r.totalDemand,requiredInventory:r.requiredInventory,stockLoss:r.stockLoss},rows:r.rows},null,2));};
for(const id of ['pathway','horizon','penetration','bridge','intensity','inventory'])$(id).addEventListener('input',render);
for(let i=0;i<3;i++){ $('control'+i).addEventListener('input',render);$('slider'+i).addEventListener('input',()=>{$('control'+i).value=$('slider'+i).value;render();});}
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{for(let i=0;i<3;i++)$('control'+i).value=b.dataset.preset;render();});
$('language').onchange=()=>{lang=$('language').value;applyLanguage();render();};$('compact').onchange=()=>document.body.classList.toggle('compact',$('compact').checked);
$('applyInventory').onclick=()=>{$('inventory').value=Math.ceil(lastResult.requiredInventory*1000-1e-10)/1000;render();};
$('rotateLeft').onclick=()=>{angles.a-=.25;drawCube(lastResult);};$('rotateRight').onclick=()=>{angles.a+=.25;drawCube(lastResult);};let dragging=null;$('cube').onpointerdown=e=>{dragging=[e.clientX,e.clientY];$('cube').setPointerCapture(e.pointerId);};$('cube').onpointermove=e=>{if(dragging){angles.a+=(e.clientX-dragging[0])*.008;angles.e=Math.max(.1,Math.min(1.3,angles.e+(e.clientY-dragging[1])*.008));dragging=[e.clientX,e.clientY];drawCube(lastResult);}};$('cube').onpointerup=$('cube').onpointercancel=()=>dragging=null;
$('cube').onkeydown=e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();if(e.key==='ArrowLeft')angles.a-=.15;if(e.key==='ArrowRight')angles.a+=.15;if(e.key==='ArrowUp')angles.e=Math.min(1.5,angles.e+.12);if(e.key==='ArrowDown')angles.e=Math.max(.1,angles.e-.12);drawCube(lastResult);}};
$('resetView').onclick=()=>{angles={a:-.70,e:.52};drawCube(lastResult);};$('topView').onclick=()=>{angles={a:0,e:1.5};drawCube(lastResult);};for(const id of ['showExact','showSVM','showGuides'])$(id).onchange=()=>{drawCube(lastResult);drawSlice(lastResult);};
if(new URLSearchParams(location.search).get('compact')==='1'){$('compact').checked=true;document.body.classList.add('compact');}
applyLanguage();render();

</script></body></html>
